name: One-time Bun lockfile recovery (2026-10-20)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-bun-lock-main-2026-10-20.yml

permissions:
  contents: write

concurrency:
  group: one-time-bun-lock-main-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install approved Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify toolchain and baseline
        run: |
          test "$(bun --version)" = "1.3.14"
          bun --version
          node --version
          git rev-parse HEAD
          git status --short

      - name: Regenerate lockfile with official Bun
        run: |
          bun install
          bun install --frozen-lockfile
          git diff --exit-code -- package.json

      - name: Verify expected versions after Bun resolution
        run: |
          bun -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const lock = JSON.parse(readFileSync("bun.lock", "utf8"));
            for (const dep of ["@lovable.dev/vite-tanstack-config", "nitro"]) {
              const expected = pkg.devDependencies[dep];
              const locked = lock.workspaces[""].devDependencies[dep];
              if (expected !== locked) throw new Error(`${dep} expected ${expected}, locked ${locked}`);
              const resolution = lock.packages[dep]?.[0] ?? "";
              if (resolution !== `${dep}@${expected}`) throw new Error(`${dep} resolution ${resolution} != ${expected}`);
            }
            console.log("Lockfile matches package manifest");
          '

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit verified Bun-generated lockfile directly to main
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- package.json
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git add -- bun.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(build): restore Bun 1.3.14 lockfile alignment'
          git push origin HEAD:main
