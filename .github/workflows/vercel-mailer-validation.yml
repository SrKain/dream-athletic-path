name: Vercel and Mailer Validation

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mailer-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify toolchain
        run: |
          bun --version
          node --version
          test "$(bun --version)" = "1.3.14"

      - name: Verify immutable dependency install
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
          git diff --check

      - name: Typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
