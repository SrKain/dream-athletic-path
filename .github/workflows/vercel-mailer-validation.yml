name: Vercel and Mailer Validation

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mailer-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify toolchain
        run: |
          bun --version
          node --version
          test "$(bun --version)" = "1.3.14"

      - name: Verify immutable dependency install
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
          git diff --check

      - name: Apply TASK-105 Prettier (temporary)
        if: "github.event_name == 'push' && github.event.head_commit.message == 'chore(mailer): format TASK-105 files'"
        run: |
          bunx prettier --write src/lib/email/email-blocks.ts src/lib/email/mailer-queue.server.ts src/lib/email/mailer-queue.test.ts src/lib/email/mailer-text-integrity.test.ts src/lib/email/recruit-email-catalog-template.ts src/lib/email/recruit-email-template.ts src/lib/email/recruit-email.server.ts src/lib/email/recruit-email.ts src/routes/_authenticated/admin/mailer.tsx
          git diff --check
          git diff --exit-code -- package.json bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/email src/routes/_authenticated/admin/mailer.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(mailer): format TASK-105 files"
            git push origin HEAD:main
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
