name: Vercel and Mailer Validation

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mailer-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify toolchain
        run: |
          bun --version
          node --version
          test "$(bun --version)" = "1.3.14"

      # Repair only the dedicated, user-approved branch. PRs must use committed lock.
      - name: Regenerate bun.lock with official Bun
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/2026-10-16-vercel-mailer-reliability'
        run: bun install

      - name: Verify immutable dependency install
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile
          git diff --exit-code -- package.json
          if [ "$GITHUB_REF_NAME" != "fix/2026-10-16-vercel-mailer-reliability" ]; then
            git diff --exit-code -- bun.lock
          fi

      - name: Format changed TypeScript files with project Prettier
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/2026-10-16-vercel-mailer-reliability'
        run: |
          bunx prettier --write \
            src/lib/email/mailer-queue.server.ts \
            src/lib/email/mailer-queue.test.ts \
            src/routes/_authenticated/admin/mailer.tsx

      - name: Format approved Quick Facts files for patch review
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/2026-10-19-mailer-quick-facts'
        run: |
          bunx prettier --write src/lib/email/athlete-quick-facts.ts src/lib/email/athlete-board-card.ts src/lib/email/athlete-board-card.test.ts src/lib/email/recruit-email.ts src/lib/email/email-layout.ts src/lib/email/personal-email-renderer.ts src/lib/email/recruit-email-multi.test.ts src/lib/email/recruit-email-send.test.ts src/lib/email/mailer-queue.test.ts src/lib/email/__fixtures__/*.ts scripts/render-mailer-quick-facts-preview.ts
          git diff -- src/lib/email scripts/render-mailer-quick-facts-preview.ts

      - name: Typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit verified lockfile to correction branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/2026-10-16-vercel-mailer-reliability'
        shell: bash
        run: |
          git add bun.lock src/lib/email/mailer-queue.server.ts src/lib/email/mailer-queue.test.ts src/routes/_authenticated/admin/mailer.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(build): synchronize bun.lock with Bun 1.3.14 after validation'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

