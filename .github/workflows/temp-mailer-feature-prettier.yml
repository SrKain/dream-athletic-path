name: Temporary Mailer Prettier
on:
  push:
    branches:
      - feat/2026-10-19-mailer-card-campos-obrigatorios
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen installation
        run: bun install --frozen-lockfile
      - name: Format changed Mailer source files only
        run: |
          bunx prettier --write \
            src/components/send-recruit-email-dialog.tsx \
            src/lib/email/athlete-board-card.test.ts \
            src/lib/email/athlete-board-card.ts \
            src/lib/email/athlete-email-data.server.ts \
            src/lib/email/athlete-email-quality.ts \
            src/lib/email/email-layout.ts \
            src/lib/email/mailer-queue.server.ts \
            src/lib/email/personal-email-renderer.ts \
            src/lib/email/recruit-email-send.test.ts \
            src/lib/email/recruit-email-template.ts \
            src/lib/email/recruit-email.functions.ts \
            src/lib/email/recruit-email.server.ts \
            src/lib/email/recruit-email.ts \
            src/routes/_authenticated/admin/mailer.tsx
          git diff --exit-code -- bun.lock package.json
      - name: Commit code formatting on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/send-recruit-email-dialog.tsx src/lib/email/athlete-board-card.test.ts src/lib/email/athlete-board-card.ts src/lib/email/athlete-email-data.server.ts src/lib/email/athlete-email-quality.ts src/lib/email/email-layout.ts src/lib/email/mailer-queue.server.ts src/lib/email/personal-email-renderer.ts src/lib/email/recruit-email-send.test.ts src/lib/email/recruit-email-template.ts src/lib/email/recruit-email.functions.ts src/lib/email/recruit-email.server.ts src/lib/email/recruit-email.ts src/routes/_authenticated/admin/mailer.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(mailer): formatar arquivos alterados com Prettier'
            git push origin 'HEAD:feat/2026-10-19-mailer-card-campos-obrigatorios'
          fi
