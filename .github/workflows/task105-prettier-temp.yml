name: Temporary TASK-105 formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-mailer:
    if: github.event.head_commit.message == 'chore(mailer): format TASK-105 files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore immutable deps
        run: bun install --frozen-lockfile
      - name: Format only TASK-105 files
        run: |
          bunx prettier --write \
            src/lib/email/email-blocks.ts \
            src/lib/email/mailer-queue.server.ts \
            src/lib/email/mailer-queue.test.ts \
            src/lib/email/mailer-text-integrity.test.ts \
            src/lib/email/recruit-email-catalog-template.ts \
            src/lib/email/recruit-email-template.ts \
            src/lib/email/recruit-email.server.ts \
            src/lib/email/recruit-email.ts \
            src/routes/_authenticated/admin/mailer.tsx
          git diff --check
          git diff --exit-code -- package.json bun.lock
      - name: Publish formatting commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/email src/routes/_authenticated/admin/mailer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(mailer): apply Prettier to TASK-105 changes"
          git push origin HEAD:main
